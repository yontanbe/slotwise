# Supabase CLI config for Slotwise. Used by `supabase link`, `supabase db push`,
# `supabase functions deploy` and `supabase config push` (see docs/DEPLOY.md, scripts/setup-supabase.sh).
#
# Hosted project notes:
# - `supabase db push` applies supabase/migrations/*.sql (001_schema.sql is a copy of schema.sql,
#   002_server.sql is the server additions). Keep 001_schema.sql identical to schema.sql.
# - The [auth] section below is only sent to the hosted project by `supabase config push`
#   (optional). You can set the same values by hand in Dashboard > Authentication > URL Configuration
#   and > Sign In / Providers. Replace slotwise.pages.dev / slotwise.example.com with your URLs.
# - env(...) values are read from the shell when running the CLI, e.g. from .env.supabase.
project_id = "slotwise"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Must match the hosted project (`show server_version;`). New projects are on 17.
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Where magic links / confirmation emails land. Use the production URL of the app.
site_url = "https://slotwise.pages.dev"
# The app redirects to `<origin><path>` (OAuth) and `<origin><path>#/app` (email links).
# `**` also covers the hash. Preview deployments are <hash>.slotwise.pages.dev.
additional_redirect_urls = [
  "http://localhost:5173/**",
  "http://127.0.0.1:5173/**",
  "http://localhost:4173/**",
  "https://slotwise.pages.dev/**",
  "https://*.slotwise.pages.dev/**",
  "https://slotwise.example.com/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

# The built-in email sender is limited to a few emails per hour. For real use add SMTP
# (for example Resend: host smtp.resend.com, port 465, user "resend").
# [auth.email.smtp]
# enabled = true
# host = "smtp.resend.com"
# port = 465
# user = "resend"
# pass = "env(SUPABASE_AUTH_SMTP_PASS)"
# admin_email = "noreply@slotwise.example.com"
# sender_name = "Slotwise"

# Google sign in. Google Cloud > Credentials > OAuth client (Web):
# Authorized redirect URI = https://<PROJECT_REF>.supabase.co/auth/v1/callback
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false

# Microsoft sign in. Azure portal > App registrations > Web redirect URI =
# https://<PROJECT_REF>.supabase.co/auth/v1/callback
[auth.external.azure]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_AZURE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_AZURE_SECRET)"
redirect_uri = ""
# Multi-tenant + personal accounts. Single tenant: https://login.microsoftonline.com/<tenant-id>
url = "https://login.microsoftonline.com/common"

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

# None of the callers send a Supabase JWT (see docs/SERVER.md section 3), so verify_jwt is off.
# All functions share supabase/functions/deno.json for bare imports (luxon, @hebcal/core, supabase-js).
[functions.api]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.mcp]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.cron]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.webhooks]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.whatsapp]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.stripe]
verify_jwt = false
import_map = "./functions/deno.json"

[analytics]
enabled = false
